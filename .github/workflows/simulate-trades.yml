name: AI Trade Simulation

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger trade simulation
        run: |
          echo "Calling simulation endpoint..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            https://stockuptrend.vercel.app/api/cron/simulate-trades)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "ERROR: endpoint returned $status"
            exit 1
          fi
